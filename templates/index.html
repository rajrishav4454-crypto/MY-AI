<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice AI Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a2e, #0f0f1a);
            overflow: hidden;
            font-family: sans-serif;
            color: white;
            flex-direction: column;
        }

        .ai-core {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 5px solid transparent;
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        .ring.inner {
            width: 70%;
            height: 70%;
            border-top-color: #9d00ff;
            animation: spin-reverse 2s linear infinite;
        }

        .core-center {
            width: 40%;
            height: 40%;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 30px #00d2ff, 0 0 60px #9d00ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        #status {
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="ai-core">
        <div class="ring"></div>
        <div class="ring inner"></div>
        <div class="core-center"></div>
    </div>
    <div id="status">Click anywhere to start listening</div>

    <script>
        const statusDiv = document.getElementById('status');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let selectedVoice = null;

        function updateVoiceList() {
            const voices = window.speechSynthesis.getVoices();
            // Try to find a suitable female voice
            selectedVoice = voices.find(voice => 
                voice.name.includes("Female") || 
                voice.name.includes("Natural") || 
                voice.name.includes("Google") ||
                voice.lang.includes("hi")
            ) || voices[0];
        }

        window.speechSynthesis.onvoiceschanged = updateVoiceList;
        updateVoiceList();

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                statusDiv.innerText = "You said: " + transcript;

               
                
                    fetch('http://localhost:5000', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
                  {
                  fetch('http://localhost:5000', {
method: 'POST',
headers: {
'Content-Type': 'application/json'
},
body: JSON.stringify({ transcript: transcript })
})
.then(response => response.json())
.then(data => speak(data.reply))
.catch(error => console.error('Error:', error));
                }
            };
            

            recognition.onerror = (event) => {
                statusDiv.innerText = "Error occurred: " + event.error;
            };

            recognition.onend = () => {
                if (statusDiv.innerText.startsWith("You said:")) {
                    // Keep showing the transcript briefly
                }
            };
        } else {
            statusDiv.innerText = "Speech Recognition not supported in this browser.";
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // Stop any ongoing speech
            const utterance = new SpeechSynthesisUtterance(text);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            utterance.rate = 1.0; // Normal speed
            window.speechSynthesis.speak(utterance);
            recognition.onend = () => recognition.start();
        }

        function generateAnswer(question) {
            const responseText = "You asked about " + question + ". I am processing this.";
            speak(responseText);
        }

        window.onclick = () => {
            if (recognition) {
                try {
                    recognition.start();
                    statusDiv.innerText = "Listening...";
                } catch (e) {
                    console.log("Recognition already running");
                }
            }
        };
    </script>
</body>
</html>
