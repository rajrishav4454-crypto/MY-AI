<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice AI Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a2e, #0f0f1a);
            overflow: hidden;
            font-family: sans-serif;
            color: white;
            flex-direction: column;
        }

        .ai-core {
            position: relative;
            width: 80vmin;
            max-width: 400px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 5px solid transparent;
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        .ring.inner {
            width: 70%;
            height: 70%;
            border-top-color: #9d00ff;
            animation: spin-reverse 2s linear infinite;
        }

        .core-center {
            width: 40%;
            height: 40%;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 30px #00d2ff, 0 0 60px #9d00ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        #status {
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="ai-core">
        <div class="ring"></div>
        <div class="ring inner"></div>
        <div class="core-center"></div>
    </div>
    <div id="status">Click anywhere to start listening</div>

    <script>
        const statusDiv = document.getElementById('status');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let selectedVoice = null;
        let isAssistantActive = false;

        function updateVoiceList() {
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices.find(voice => 
                voice.lang.includes("hi") || 
                voice.name.includes("Female") || 
                voice.name.includes("Google")
            ) || voices[0];
        }

        window.speechSynthesis.onvoiceschanged = updateVoiceList;
        updateVoiceList();

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'hi-IN'; // हिंदी और इंग्लिश दोनों समझने के लिए

            recognition.onresult = (event) => {
                // हमेशा सबसे आखिरी बोली गई लाइन लें
                const lastResultIndex = event.results.length - 1;
                const transcript = event.results[lastResultIndex][0].transcript.trim();
                statusDiv.innerText = "You said: " + transcript;

                // सर्वर पर डेटा भेजें
                fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ transcript: transcript })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.reply) {
                        speak(data.reply);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    statusDiv.innerText = "Server error!";
                });
            };

            recognition.onerror = (event) => {
                console.log("Speech error:", event.error);
            };

            // जैसे ही सुनना बंद हो, अपने आप दोबारा शुरू करें
            recognition.onend = () => {
                if (isAssistantActive) {
                    try {
                        recognition.start();
                    } catch (e) {}
                }
            };
        } else {
            statusDiv.innerText = "Speech Recognition not supported in this browser.";
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // पहली बार स्क्रीन पर कहीं भी क्लिक करने से असिस्टेंट चालू हो जाएगा
        window.onclick = () => {
            if (recognition && !isAssistantActive) {
                isAssistantActive = true;
                try {
                    recognition.start();
                    statusDiv.innerText = "Listening...";
                } catch (e) {
                    console.log("Already running");
                }
            }
        };
    </script>
</body>
</html>
